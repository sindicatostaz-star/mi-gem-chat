<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot S.T.A.Z</title>
    <style>
        /* Mismos estilos que antes */
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; height: 600px; background: white; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: linear-gradient(135deg, #4285f4, #8ab4f8); color: white; padding: 20px; font-weight: bold; text-align: center; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 10px 15px; border-radius: 10px; max-width: 80%; line-height: 1.4; font-size: 14px; }
        .user-msg { background-color: #e8f0fe; color: #1967d2; align-self: flex-end; }
        .ai-msg { background-color: #f1f3f4; color: #333; align-self: flex-start; }
        .input-area { border-top: 1px solid #eee; padding: 15px; display: flex; gap: 10px; background: #fff; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { padding: 10px 20px; background: #4285f4; color: white; border: none; border-radius: 20px; cursor: pointer; }
        .loading { font-style: italic; color: #888; font-size: 12px; margin-left: 10px; display: none;}
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Mi Gem Protegido</div>
        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">Buenos días, soy el ChatBot del Acuerdo de Condiciones Laborales del Personal Funcionario del Ayuntamiento de Zaragoza, ¿En que te puedo Ayudar?</div>
        </div>
        <div class="loading" id="loadingIndicator">Pensando...</div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Mensaje..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()" id="sendBtn">Enviar</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');
        
        let conversationHistory = [];

        function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user-msg');
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            loadingIndicator.style.display = 'block';

            // Agregamos al historial
            conversationHistory.push({ role: "user", parts: [{ text: text }] });

            try {
                // LLAMAMOS A NUESTRO PROPIO SERVIDOR, NO A GOOGLE
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history: conversationHistory })
                });

                const data = await response.json();

                if (data.candidates) {
                    const aiResponse = data.candidates[0].content.parts[0].text;
                    addMessage(aiResponse, 'ai-msg');
                    conversationHistory.push({ role: "model", parts: [{ text: aiResponse }] });
                } else {
                    addMessage("Error en la respuesta.", 'ai-msg');
                }
            } catch (error) {
                addMessage("Error de conexión con el servidor.", 'ai-msg');
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                loadingIndicator.style.display = 'none';
                userInput.focus();
            }
        }

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
